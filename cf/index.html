<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>LOCO-P｜CAMPFIRE リターン デザイン入稿</title>
<style>
:root{
  --bg:#FFFDF8; --ink:#23262F; --mute:#6B6F7B; --line:#E7E2D8;
  --primary:#F2503F; --primary-d:#D6402A; --teal:#15C2A6; --soft:#FFF1EF; --card:#FFFFFF;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;}
body{padding:0 0 100px;line-height:1.6;font-size:15px;}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;}
header{background:var(--primary);color:#fff;padding:18px 16px 16px;}
header .h-in{max-width:560px;margin:0 auto;}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em;}
header p{margin:4px 0 0;font-size:12.5px;opacity:.95;}
.steps{display:flex;gap:6px;margin:14px 0 4px;}
.steps div{flex:1;height:5px;border-radius:3px;background:#EFE7DB;}
.steps div.on{background:var(--primary);}
.steps div.done{background:#F3B4AB;}
.stepname{font-size:12px;color:var(--mute);margin-bottom:12px;}
h2{font-size:17px;margin:18px 0 8px;font-weight:800;}
h2 .num{color:var(--primary);margin-right:6px;}
p.lead{margin:0 0 12px;font-size:13.5px;color:#4a4e58;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.card.sel{border-color:var(--primary);box-shadow:0 0 0 2px rgba(242,80,63,.14);}
label.f{display:block;font-size:13px;font-weight:700;margin:14px 0 5px;}
label.f span{font-weight:400;color:var(--mute);font-size:12px;}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
  background:#fff;color:var(--ink);font-family:inherit;}
textarea{min-height:76px;resize:vertical;}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--primary);
  color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn:disabled{background:#D9D5CD;color:#fff;}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn.sm{padding:10px;font-size:14px;}
.row{display:flex;gap:10px;}
.row .btn{flex:1;}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px;}
.nav .in .btn.back{flex:0 0 34%;}
.nav .in .btn{flex:1;}
.muted{color:var(--mute);font-size:12.5px;}
.dev-group{margin-bottom:14px;}
.dev-group h3{font-size:13px;color:var(--mute);margin:0 0 8px;font-weight:700;}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dev{padding:12px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:13.5px;font-weight:700;text-align:center;cursor:pointer;}
.dev.on{border-color:var(--primary);background:var(--soft);color:var(--primary-d);}
.cnt{display:flex;align-items:center;gap:10px;}
.cnt button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:20px;font-weight:700;color:var(--primary);cursor:pointer;line-height:1;}
.cnt .v{min-width:44px;text-align:center;font-size:17px;font-weight:800;}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--soft);
  border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:10px 0;}
.tot.ok{background:#E7F8F4;color:#0a7c69;}
.tot.over{background:#FFEDE9;color:#C0392B;}

/* --- 写真エディタ（通常版に準拠） --- */
.modeltag{display:inline-block;background:#F4F2EC;color:var(--mute);border-radius:8px;
  padding:4px 10px;font-size:11.5px;font-weight:700;margin-bottom:8px;letter-spacing:.02em;}
.stage{display:flex;justify-content:center;padding:6px 0 2px;}
.case{position:relative;touch-action:none;}
.case canvas{display:block;box-shadow:0 4px 16px rgba(0,0,0,.14);}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;color:#9a958c;font-size:13px;font-weight:700;gap:6px;pointer-events:none;}
.camnote{text-align:center;font-size:11.5px;color:var(--mute);margin:6px 0 10px;}
.ctrl{display:flex;align-items:center;gap:8px;margin:6px 0;}
.rnd{width:42px;height:42px;flex:0 0 auto;border-radius:50%;border:1px solid var(--line);
  background:#fff;color:var(--ink);font-size:17px;font-weight:800;cursor:pointer;line-height:1;
  display:flex;align-items:center;justify-content:center;font-family:inherit;}
.rnd:disabled{opacity:.35;}
.rnd.danger{color:#C0392B;border-color:#F3B4AB;}
.range{flex:1;min-width:0;}
.order{display:flex;align-items:center;gap:8px;margin:4px 0 10px;}
.mini{padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;
  font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit;}
.mini:disabled{opacity:.4;}
.order .hint{font-size:11.5px;color:var(--mute);margin-left:auto;}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px;}
.thumb{width:56px;height:56px;padding:0;border:2px solid var(--line);border-radius:10px;
  overflow:hidden;background:#fff;cursor:pointer;}
.thumb.on{border-color:var(--primary);box-shadow:0 0 0 2px rgba(242,80,63,.2);}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.addtile{width:56px;height:56px;border:2px dashed var(--line);border-radius:10px;background:#fff;
  color:var(--primary);font-size:11px;font-weight:800;cursor:pointer;display:flex;
  flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:inherit;}
.addtile b{font-size:18px;line-height:1;}
.bgrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px;}
.bglabel{font-size:12.5px;font-weight:700;color:var(--mute);}
.sw{display:flex;flex-wrap:wrap;gap:8px;}
.sw button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;}
.sw button.on{border-color:var(--primary);box-shadow:0 0 0 2px rgba(242,80,63,.2);}
.file{display:block;padding:26px 12px;border:2px dashed var(--line);border-radius:12px;text-align:center;
  color:var(--mute);font-size:14px;background:#fff;cursor:pointer;font-weight:700;}
.file span{display:block;font-size:11.5px;font-weight:400;margin-top:4px;}
.dlist .card{display:flex;gap:12px;align-items:center;}
.dlist canvas{width:56px;border-radius:6px;flex:0 0 auto;background:#fff;}
.dlist .info{flex:1;min-width:0;}
.dlist .info b{display:block;font-size:14px;}
.dlist .info span{font-size:12px;color:var(--mute);}
.dlist .del{background:none;border:0;color:#C0392B;font-size:12.5px;font-weight:700;cursor:pointer;padding:6px;}
table.sum{width:100%;border-collapse:collapse;font-size:13.5px;}
table.sum td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;}
table.sum td:first-child{color:var(--mute);width:38%;}
.err{background:#FFEDE9;color:#C0392B;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;font-weight:700;}
.ok-box{text-align:center;padding:26px 10px;}
.ok-box .big{font-size:44px;}
.load{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--mute);font-size:13px;}
.spin{width:18px;height:18px;border:3px solid #E7E2D8;border-top-color:var(--primary);
  border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.hint-box{background:#FFF9F0;border:1px solid #F0E2C8;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0;}
footer{text-align:center;color:var(--mute);font-size:11.5px;padding:22px 12px 6px;}
</style>
</head>

/* タップした位置にある写真を判定（通常版の Zg と同じ） */
function hitLayer(layers, px, py, fr){
  for(var s=layers.length-1; s>=0; s--){
    var i=layers[s]; if(!i.img) continue;
    var h=Math.min(fr.w/i.iw, fr.h/i.ih)*i.relScale;
    var p=fr.x+fr.w*(.5+i.fx), x=fr.y+fr.h*(.5+i.fy);
    var y=px-p, D=py-x, B=-i.rot*Math.PI/180;
    var r=y*Math.cos(B)-D*Math.sin(B), n=y*Math.sin(B)+D*Math.cos(B);
    if(Math.abs(r/h)<=i.iw/2 && Math.abs(n/h)<=i.ih/2) return i.id;
  }
  return null;
}

}

/* 写真の追加（複数同時OK・通常版と同じ初期配置） */
function addFiles(files){
  var d=S.edit;
  var list=[].slice.call(files||[]).filter(function(f){ return f && (!f.type || f.type.indexOf("image/")===0); });
  var room=MAX_PHOTOS-d.layers.length;
  var use=list.slice(0,room);
  S.msg="";
  if(!use.length){ S.msg = room<=0 ? ("写真は最大"+MAX_PHOTOS+"枚までです。") : "画像ファイルを選んでください。"; renderEditor(); return; }
  if(list.length>room) S.msg="写真は最大"+MAX_PHOTOS+"枚まで。"+room+"枚を追加しました。";
  var left=use.length, added=[];
  var done=function(){
    left-=1;
    if(left===0){
      added.forEach(function(L){ d.layers.push(L); });
      if(added.length) d.sel=added[added.length-1].id;
      renderEditor();
    }
  };
  var fr=frameOf(100,Math.round(100/(findModel(d.deviceTag)||{ratio:.47}).ratio));
  use.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(ev){
      var src=ev.target.result, im=new Image();
      im.onload=function(){
        var iw=im.naturalWidth||im.width, ih=im.naturalHeight||im.height;
        var first=(d.layers.length+added.length)===0, rel=1;
        if(first){
          var cover=Math.max(fr.w/iw, fr.h/ih), contain=Math.min(fr.w/iw, fr.h/ih);
          rel=clamp(cover/contain, MIN_SCALE, MAX_SCALE);
        }
        var n=d.layers.length+added.length;
        var off=first?0:clamp(0.07*n,0,0.26);
        added.push({ id:uid(), src:src, img:im, iw:iw, ih:ih, fx:off, fy:off, relScale:rel, rot:0 });
        done();
      };
      im.onerror=function(){ S.msg="読み込めない写真がありました（JPEG/PNGでお試しください）。"; done(); };
      im.src=src;
    };
    rd.onerror=function(){ S.msg="ファイルを読み込めませんでした。"; done(); };
    rd.readAsDataURL(f);
  });
}

/* キャンバス＋ジェスチャー（1本指=移動／2本指=拡大縮小・回転） */
var PT=new Map(), GEST=null, STG={W:0,H:0};
function setupStage(W,H){
  STG.W=W; STG.H=H;
  var box=document.getElementById("case"), cv=document.getElementById("pv");
  var dpr=Math.min(2, window.devicePixelRatio||1);
  cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr);
  cv._dpr=dpr; paint();
  PT.clear(); GEST=null;
  var fr=frameOf(W,H);
  box.onpointerdown=function(ev){
    box.setPointerCapture(ev.pointerId);
    PT.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    var d=S.edit;
    if(PT.size===1){
      var r=box.getBoundingClientRect();
      var id=hitLayer(d.layers, ev.clientX-r.left, ev.clientY-r.top, fr);
      if(id){
        var L=null; d.layers.forEach(function(x){ if(x.id===id) L=x; });
        if(d.sel!==id){ d.sel=id; renderEditor(); return; }
        GEST={mode:"drag", L:L, sx:ev.clientX, sy:ev.clientY, fx:L.fx, fy:L.fy};
      } else { if(d.sel!==null){ d.sel=null; renderEditor(); } GEST=null; }
    } else if(PT.size===2){
      var L2=curLayer() || d.layers[d.layers.length-1];
      if(L2){
        d.sel=L2.id;
        var p=[].slice.call(PT.values()), c=mid(p[0],p[1]);
        GEST={mode:"pinch", L:L2, d0:dist(p[0],p[1]), a0:angle(p[0],p[1]),
              mx:c.x, my:c.y, rel0:L2.relScale, rot0:L2.rot, fx:L2.fx, fy:L2.fy};
      }
    }
  };
  box.onpointermove=function(ev){
    if(!PT.has(ev.pointerId)) return;
    PT.set(ev.pointerId,{x:ev.clientX,y:ev.clientY});
    if(!GEST) return;
    if(GEST.mode==="drag"){
      GEST.L.fx=clamp(GEST.fx+(ev.clientX-GEST.sx)/fr.w,-0.5,0.5);
      GEST.L.fy=clamp(GEST.fy+(ev.clientY-GEST.sy)/fr.h,-0.5,0.5);
      paint();
    } else if(GEST.mode==="pinch"){
      var p=[].slice.call(PT.values()); if(p.length<2) return;
      var c=mid(p[0],p[1]);
      GEST.L.relScale=clamp(GEST.rel0*(dist(p[0],p[1])/GEST.d0), MIN_SCALE, MAX_SCALE);
      var rr=GEST.rot0+(angle(p[0],p[1])-GEST.a0);
      GEST.L.rot=((rr%360)+360)%360;
      GEST.L.fx=clamp(GEST.fx+(c.x-GEST.mx)/fr.w,-0.5,0.5);
      GEST.L.fy=clamp(GEST.fy+(c.y-GEST.my)/fr.h,-0.5,0.5);
      syncRange(); paint();
    }
  };
  var up=function(ev){
    PT.delete(ev.pointerId);
    if(PT.size===0){ GEST=null; }
    else if(PT.size===1 && GEST){
      var p=[].slice.call(PT.values())[0], L=GEST.L;
      if(L) GEST={mode:"drag", L:L, sx:p.x, sy:p.y, fx:L.fx, fy:L.fy};
    }
  };
  box.onpointerup=up; box.onpointercancel=up;
}
function paint(){
  var cv=document.getElementById("pv"); if(!cv) return;
  var d=S.edit, m=findModel(d.deviceTag)||allModels()[0];
  var ctx=cv.getContext("2d");
  ctx.setTransform(cv._dpr,0,0,cv._dpr,0,0);
  ctx.clearRect(0,0,STG.W,STG.H);
  renderCase(ctx,{ layers:d.layers, bg:d.bg, W:STG.W, H:STG.H, radius:STG.W*0.11,
    island:m.island, cam:m.cam, withCam:true, selectedId:d.sel });
}

/* ---------- STEP4 ---------- */

    + '<label class="f">お届け先のお名前</label><input type="text" id="sn" value="'+esc(s.name)+'">'

    + '<label class="f">ご連絡方法</label><select id="sm">'
    + ['LINE','電話','メール'].map(function(x){ return '<option '+(s.method===x?"selected":"")+'>'+x+'</option>'; }).join('')
    + '</select>'
    + '<label class="f">ご連絡先 <span>（ID・番号・アドレス）</span></label><input type="text" id="sc2" value="'+esc(s.contact)+'">'

function canNext4(){ var s=S.ship; return !!(s.name.trim()&&s.addr.trim()&&s.contact.trim()); }

/* ---------- STEP5 ---------- */

    + row("ご要望",esc(S.ship.notes)||"なし")

function row(k,v){ return '<tr><td>'+esc(k)+'</td><td>'+(v||"")+'</td></tr>'; }

function renderDone(){
  $steps.innerHTML=""; $sname.textContent="";
  $view.innerHTML='<div class="ok-box"><div class="big">🎉</div><h2>入稿が完了しました</h2>'
    + '<p class="lead">受付番号：<b>'+esc(S.orderNo)+'</b></p>'
    + '<p class="lead">ご支援ありがとうございます。内容を確認のうえ、スタッフより折り返しご連絡いたします。この画面は閉じていただいて大丈夫です。</p>'
    + '<div class="hint-box" style="text-align:left">発送は2026年10月を予定しています。ご不明な点は mihara@kihoukai.or.jp までお問い合わせください。</div></div>';
  $nav.innerHTML="";
}

/* ---------- ナビ ---------- */
var NAV={};
function nav(back,next,onNext,ok,onBack){
  NAV={onNext:onNext,onBack:onBack};
  var h="";
  if(back) h+='<button class="btn ghost back" id="nb">'+esc(back)+'</button>';
  h+='<button class="btn" id="nn" '+(ok?"":"disabled")+'>'+esc(next)+'</button>';
  $nav.innerHTML=h;
  if(back) document.getElementById("nb").onclick=function(){ NAV.onBack&&NAV.onBack(); };
  document.getElementById("nn").onclick=function(){ NAV.onNext&&NAV.onNext(); };
}
function navUpdate(){
  var b=document.getElementById("nn"); if(!b) return;
  b.disabled = !(S.step===0?canNext1():(S.step===3?canNext4():true));
}

/* ---------- 送信 ---------- */
function makeNo(){
  var d=new Date(), p=function(n){ return (n<10?"0":"")+n; };
  return "CF"+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+"-"+Math.floor(1000+Math.random()*9000);
}
function composeDataURL(d){
  var m=findModel(d.deviceTag), H=OUT_LONG, W=Math.round(H*m.ratio);
  var c=document.createElement("canvas"); c.width=W; c.height=H;
  var ctx=c.getContext("2d"); ctx.fillStyle="#FFFDF8"; ctx.fillRect(0,0,W,H);
  renderCase(ctx,{layers:d.layers,bg:d.bg,W:W,H:H,radius:W*0.11,island:m.island,cam:m.cam,withCam:true,selectedId:null});
  return c.toDataURL("image/jpeg",0.92);
}
function upload(dataUrl,name){
  var fd=new FormData();
  fd.append("image",dataUrl.split(",")[1]); fd.append("name",name);
  return fetch("https://api.imgbb.com/1/upload?key="+IMGBB_KEY,{method:"POST",body:fd})
    .then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
    .then(function(j){ if(!j||!j.success) throw new Error("api"); return j.data.url; });
}
function submit(){
  if(S.sending) return;
  S.sending=true; S.error=""; render();
  var no=makeNo(); S.orderNo=no;
  var links=[], failed=false, seq=Promise.resolve();
  S.designs.forEach(function(d,i){
    seq=seq.then(function(){
      return upload(composeDataURL(d), no+"-d"+(i+1)+"-image")
        .then(function(u){ links.push("デザイン"+(i+1)+" 仕上がり："+u); })
        .then(function(){
          var ch=Promise.resolve();
          d.layers.forEach(function(L,j){
            ch=ch.then(function(){
              return upload(L.src, no+"-d"+(i+1)+"-orig"+(j+1))
                .then(function(u2){ links.push("デザイン"+(i+1)+" 元写真"+(j+1)+"："+u2); });
            });
          });
          return ch;
        })
        .catch(function(){ failed=true; });
    });
  });
  seq.then(function(){
    var L=[];
    L.push("【LOCO-P クラファン返礼 入稿】");
    L.push("受付番号："+no);
    L.push("■支援者名："+S.backer.name);
    L.push("■ご支援メール："+S.backer.email);
    L.push("■リターン："+S.reward.label);
    L.push("■ケース本体："+S.cases.map(function(c){ var m=findModel(c.tag); return (m?m.name:"?")+"（"+c.tag+"）× "+c.qty+"コ"; }).join(" ／ "));
    L.push("■シート合計："+totalSheets()+"枚（デザイン"+S.designs.length+"種類）");
    S.designs.forEach(function(d,i){
      var m=findModel(d.deviceTag);
      L.push("　・デザイン"+(i+1)+"： "+(m?m.name:"?")+"（"+d.deviceTag+"）／"+d.qty+"枚／写真"+d.layers.length+"枚／背景色 "+bgName(d.bg)+"（"+d.bg+"）");
    });
    L.push("■お届け先："+S.ship.name+"／〒"+S.ship.zip+"／"+S.ship.addr);
    L.push("■ご連絡先："+S.ship.method+"／"+S.ship.contact);
    L.push("■ご要望："+(S.ship.notes||"なし"));
    L.push("（"+SHOP_NAME+"）");
    L.push("");
    if(failed||!links.length) L.push("※ 画像の自動送信に失敗しました。お客さまに画像を再送いただくか、直接お問い合わせください。");
    else { L.push("―――― 画像リンク（タップで開けます） ――――"); links.forEach(function(x){ L.push(x); }); }
    return fetch("https://api.web3forms.com/submit",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ access_key:W3F_KEY, subject:"LOCO-P クラファン返礼 入稿 "+no,
        from_name:"LOCO-P リターン入稿フォーム", message:L.join("\n") })
    });
  }).then(function(r){
    if(!r||!r.ok) throw new Error("send");
    S.sending=false; S.sent=true; render();
  }).catch(function(){
    S.sending=false;
    S.error="送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。繰り返す場合は mihara@kihoukai.or.jp までご連絡ください。";
    render();
  });
}

/* 貼り付けでも写真を追加できる（通常版と同じ） */
window.addEventListener("paste",function(ev){
  if(!S.edit) return;
  var fs=[], items=(ev.clipboardData&&ev.clipboardData.items)||[];
  for(var i=0;i<items.length;i++){
    if(items[i].type && items[i].type.indexOf("image/")===0){
      var f=items[i].getAsFile(); if(f) fs.push(f);
    }
  }
  if(fs.length) addFiles(fs);
});

render();

<style>
:root{

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);

body{padding:0 0 96px;line-height:1.6;font-size:15px;}
.wrap{max-width:560px;margin:0 auto;padding:0 16px;}
header{background:var(--primary);color:#fff;padding:18px 16px 16px;}
header .h-in{max-width:560px;margin:0 auto;}
header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:.02em;}
header p{margin:4px 0 0;font-size:12.5px;opacity:.95;}
.steps{display:flex;gap:6px;margin:14px 0 4px;}
.steps div{flex:1;height:5px;border-radius:3px;background:#EFE7DB;}
.steps div.on{background:var(--primary);}
.steps div.done{background:#F3B4AB;}
.stepname{font-size:12px;color:var(--mute);margin-bottom:12px;}
h2{font-size:17px;margin:18px 0 8px;font-weight:800;}
h2 .num{color:var(--primary);margin-right:6px;}
p.lead{margin:0 0 14px;font-size:14px;color:#4a4e58;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;}
.card.sel{border-color:var(--primary);box-shadow:0 0 0 2px rgba(242,80,63,.14);}
label.f{display:block;font-size:13px;font-weight:700;margin:12px 0 5px;}
label.f span{font-weight:400;color:var(--mute);font-size:12px;}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;
  background:#fff;color:var(--ink);font-family:inherit;}
textarea{min-height:76px;resize:vertical;}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:12px;background:var(--primary);
  color:#fff;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;}
.btn:disabled{background:#D9D5CD;color:#fff;}
.btn.ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);}
.btn.sm{padding:10px;font-size:14px;}
.row{display:flex;gap:10px;}
.row .btn{flex:1;}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,253,248,.97);
  border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));}
.nav .in{max-width:560px;margin:0 auto;display:flex;gap:10px;}
.nav .in .btn{flex:1;}
.nav .in .btn.back{flex:0 0 34%;}
.pill{display:inline-block;background:var(--soft);color:var(--primary-d);border-radius:999px;
  padding:3px 10px;font-size:12px;font-weight:700;margin-right:6px;}
.muted{color:var(--mute);font-size:12.5px;}
.dev-group{margin-bottom:14px;}
.dev-group h3{font-size:13px;color:var(--mute);margin:0 0 8px;font-weight:700;}
.dev-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.dev{padding:12px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;
  font-size:13.5px;font-weight:700;text-align:center;cursor:pointer;}
.dev.on{border-color:var(--primary);background:var(--soft);color:var(--primary-d);}
.cnt{display:flex;align-items:center;gap:10px;}
.cnt button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;
  font-size:20px;font-weight:700;color:var(--primary);cursor:pointer;line-height:1;}
.cnt .v{min-width:44px;text-align:center;font-size:17px;font-weight:800;}
.tot{display:flex;justify-content:space-between;align-items:center;background:var(--soft);
  border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;margin:10px 0;}
.tot.ok{background:#E7F8F4;color:#0a7c69;}
.tot.over{background:#FFEDE9;color:#C0392B;}
.stage{position:relative;width:100%;background:#F4F2EC;border-radius:12px;overflow:hidden;
  display:flex;justify-content:center;align-items:center;padding:12px 0;}
canvas.prev{touch-action:none;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.13);background:#fff;}
.ctrl{margin-top:10px;}
.ctrl label{display:block;font-size:12.5px;font-weight:700;margin:8px 0 3px;color:var(--mute);}
input[type=range]{width:100%;}
.sw{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.sw button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;}
.sw button.on{border-color:var(--primary);box-shadow:0 0 0 2px rgba(242,80,63,.2);}
.file{display:block;padding:26px 12px;border:2px dashed var(--line);border-radius:12px;text-align:center;
  color:var(--mute);font-size:14px;background:#fff;cursor:pointer;font-weight:700;}
.dlist .card{display:flex;gap:12px;align-items:center;}
.dlist canvas{width:56px;border-radius:6px;border:1px solid var(--line);flex:0 0 auto;background:#fff;}
.dlist .info{flex:1;min-width:0;}
.dlist .info b{display:block;font-size:14px;}
.dlist .info span{font-size:12px;color:var(--mute);}
.dlist .del{background:none;border:0;color:#C0392B;font-size:12.5px;font-weight:700;cursor:pointer;padding:6px;}
table.sum{width:100%;border-collapse:collapse;font-size:13.5px;}
table.sum td{padding:8px 0;border-bottom:1px solid var(--line);vertical-align:top;}
table.sum td:first-child{color:var(--mute);width:38%;}
.err{background:#FFEDE9;color:#C0392B;border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;font-weight:700;}
.ok-box{text-align:center;padding:26px 10px;}
.ok-box .big{font-size:44px;}
.ok-box h2{font-size:19px;}
.load{display:flex;align-items:center;gap:10px;justify-content:center;color:var(--mute);font-size:13px;}
.spin{width:18px;height:18px;border:3px solid #E7E2D8;border-top-color:var(--primary);
  border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.hint{background:#FFF9F0;border:1px solid #F0E2C8;border-radius:10px;padding:10px 12px;font-size:12.5px;margin:10px 0;}
footer{text-align:center;color:var(--mute);font-size:11.5px;padding:22px 12px 6px;}

/* ---------- 背景色の名前 ---------- */
function bgName(c){
  var h=(c==null?"":(""+c)).trim().toUpperCase();
  if(h.charAt(0)!=="#")h="#"+h;
  var P={"#FFFFFF":"白","#000000":"黒","#3FA9F5":"ブルー","#FF8FB1":"ピンク","#19C3A6":"ミントグリーン","#FFE08A":"イエロー","#F4F2EC":"オフホワイト"};
  if(P[h])return P[h];
  var m=/^#([0-9A-F]{6})$/.exec(h);
  if(!m)return h||"白";
  var n=parseInt(m[1],16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn,L=(mx+mn)/510;
  if(d<20)return L>0.9?"白系":L>0.6?"ライトグレー系":L>0.25?"グレー系":"黒系";
  var hue;
  if(mx===r)hue=((g-b)/d+6)%6; else if(mx===g)hue=(b-r)/d+2; else hue=(r-g)/d+4;
  hue*=60;
  var T=[[15,"赤系"],[45,"オレンジ系"],[68,"イエロー系"],[160,"グリーン系"],[200,"シアン系"],[255,"ブルー系"],[290,"パープル系"],[335,"ピンク系"],[361,"赤系"]];
  var nm="指定色";
  for(var i=0;i<T.length;i++){ if(hue<=T[i][0]){ nm=T[i][1]; break; } }
  if(L<0.25)nm="ダーク"+nm;
  return nm;
}

function ql(a,e,t,l,u,f){f=Math.min(f,l/2,u/2),a.moveTo(e+f,t),a.arcTo(e+l,t,e+l,t+u,f),a.arcTo(e+l,t+u,e,t+u,f),a.arcTo(e,t+u,e,t,f),a.arcTo(e,t,e+l,t,f),a.closePath()}
function Ku(a,e,t,l,u,f){a.beginPath(),ql(a,e,t,l,u,f)}

function Yg(a,e,t,l,u){let f=e.x*l,o=e.y*u,d=e.w*l,s=e.h*u,i=e.r*l;if(a.save(),t==="galaxy"){a.beginPath(),Xg(a,f,o,d,s),a.fillStyle="rgba(236,234,228,0.96)",a.fill();let m=f+d*.3;Ya(a,m,o+s*.19,d*.21),Ya(a,m,o+s*.47,d*.18),Ya(a,m,o+s*.73,d*.18),Le(a,f+d*.66,o+s*.13,s*.03,"#cfcfd4"),Le(a,f+d*.62,o+s*.25,s*.018,"#888"),a.restore();return}if(Ku(a,f,o,d,s,i),a.fillStyle="rgba(236,234,228,0.96)",a.fill(),a.lineWidth=Math.max(1,l*.005),a.strokeStyle="rgba(0,0,0,0.12)",a.stroke(),t==="two-diag"){let m=s*.26;Ya(a,f+d*.3,o+s*.34,m),Ya(a,f+d*.62,o+s*.68,m),Le(a,f+d*.66,o+s*.26,s*.07,"#9aa"),Le(a,f+d*.3,o+s*.7,s*.05,"#777")}else if(t==="two-vert"){let m=s*.24;Ya(a,f+d*.34,o+s*.32,m),Ya(a,f+d*.34,o+s*.7,m),Le(a,f+d*.68,o+s*.3,s*.07,"#9aa"),Le(a,f+d*.68,o+s*.62,s*.05,"#777")}else if(t==="three"){let m=s*.26;Ya(a,f+d*.3,o+s*.3,m),Ya(a,f+d*.3,o+s*.7,m),Ya(a,f+d*.6,o+s*.5,m),Le(a,f+d*.8,o+s*.3,s*.07,"#9aa"),Le(a,f+d*.82,o+s*.62,s*.05,"#777")}else if(t==="wide"){let m=s*.24;Ya(a,f+d*.16,o+s*.3,m),Ya(a,f+d*.16,o+s*.7,m),Ya(a,f+d*.34,o+s*.5,m),Ku(a,f+d*.56,o+s*.16,d*.34,s*.68,s*.18),a.fillStyle="rgba(60,60,66,0.85)",a.fill(),Le(a,f+d*.73,o+s*.36,s*.1,"#cfcfd4"),Le(a,f+d*.73,o+s*.64,s*.08,"#222")}else if(t==="single"){let m=s*.38;Ya(a,f+d*.22,o+s*.5,m),Le(a,f+d*.46,o+s*.40,s*.09,"#9aa"),Le(a,f+d*.46,o+s*.66,s*.05,"#777")}else if(t==="pixel"){let m=s*.33;Ya(a,f+d*.30,o+s*.5,m),Ya(a,f+d*.55,o+s*.5,m),Le(a,f+d*.80,o+s*.5,s*.11,"#cfcfd4")}a.restore()}

/* ---------- 1デザインをキャンバスに合成 ---------- */
function drawDesign(ctx, d, W, H){
  var m = findModel(d.deviceTag);
  ctx.save();
  Ku(ctx, 0, 0, W, H, W*0.11);
  ctx.clip();
  ctx.fillStyle = d.bg; ctx.fillRect(0,0,W,H);
  if(d.img){
    var base = Math.min(W/d.iw, H/d.ih) * d.scale;
    ctx.save();
    ctx.translate(W*(0.5+d.fx), H*(0.5+d.fy));
    ctx.rotate(d.rot*Math.PI/180);
    ctx.drawImage(d.img, -d.iw*base/2, -d.ih*base/2, d.iw*base, d.ih*base);
    ctx.restore();
  }
  if(m) Yg(ctx, m.island, m.cam, W, H);
  ctx.restore();
  ctx.save();
  Ku(ctx, 0.5, 0.5, W-1, H-1, W*0.11);
  ctx.lineWidth = 1; ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.stroke();
  ctx.restore();
}

/* ---------- 画像読み込み（iPhoneの回転補正 + 縮小） ---------- */
function loadImage(file){
  return new Promise(function(resolve, reject){
    var done = function(src){
      var im = new Image();
      im.onload = function(){
        var mx = 1600, w = im.naturalWidth, h = im.naturalHeight;
        var sc = Math.min(1, mx/Math.max(w,h));
        if(sc < 1){
          var c = document.createElement("canvas");
          c.width = Math.round(w*sc); c.height = Math.round(h*sc);
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          var im2 = new Image();
          im2.onload = function(){ resolve(im2); };
          im2.src = c.toDataURL("image/jpeg", 0.92);
        } else resolve(im);
      };
      im.onerror = function(){ reject(new Error("画像を読み込めませんでした")); };
      im.src = src;
    };
    if(window.createImageBitmap){
      createImageBitmap(file, { imageOrientation:"from-image" }).then(function(bm){
        var c = document.createElement("canvas");
        var mx = 1600, sc = Math.min(1, mx/Math.max(bm.width, bm.height));
        c.width = Math.round(bm.width*sc); c.height = Math.round(bm.height*sc);
        c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
        done(c.toDataURL("image/jpeg", 0.92));
      }).catch(function(){
        var r = new FileReader();
        r.onload = function(){ done(r.result); };
        r.onerror = function(){ reject(new Error("読み込み失敗")); };
        r.readAsDataURL(file);
      });
    } else {
      var r = new FileReader();
      r.onload = function(){ done(r.result); };
      r.onerror = function(){ reject(new Error("読み込み失敗")); };
      r.readAsDataURL(file);
    }
  });
}

    e.className = i===S.step ? "on" : (i<S.step ? "done" : "");
    $steps.appendChild(e);
  }
  $sname.textContent = "STEP " + (S.step+1) + " / 5 ・ " + STEP_NAMES[S.step];
  ({0:stepBacker,1:stepCases,2:stepDesigns,3:stepShip,4:stepConfirm})[S.step]();
  window.scrollTo(0,0);
}

      + '</div>'

      + '<div style="margin-top:8px"><label class="f">その他の色</label><input type="color" id="cc" value="'+esc(d.bg)+'" style="width:100%;height:44px;border:1px solid var(--line);border-radius:10px;background:#fff"></div>';

    S.edit = null; render();
  }, !!d.img, function(){ S.edit = null; render(); });
}

function setupCanvas(){
  var d = S.edit, m = findModel(d.deviceTag);
  var cv = document.getElementById("pv");
  var maxH = Math.min(window.innerHeight*0.46, 420);
  var H = Math.round(maxH), W = Math.round(H * m.ratio);
  var dpr = Math.min(window.devicePixelRatio||1, 2);
  cv.width = W*dpr; cv.height = H*dpr;
  cv.style.width = W+"px"; cv.style.height = H+"px";
  cv._W = W; cv._H = H; cv._dpr = dpr;
  paint();
  var drag = null;
  cv.addEventListener("pointerdown", function(e){
    drag = { x:e.clientX, y:e.clientY, fx:d.fx, fy:d.fy };
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener("pointermove", function(e){
    if(!drag) return;
    d.fx = drag.fx + (e.clientX - drag.x)/cv._W;
    d.fy = drag.fy + (e.clientY - drag.y)/cv._H;
    paint();
  });
  cv.addEventListener("pointerup", function(){ drag = null; });
  cv.addEventListener("pointercancel", function(){ drag = null; });
}
function paint(){
  var cv = document.getElementById("pv"); if(!cv) return;
  var ctx = cv.getContext("2d");
  ctx.setTransform(cv._dpr,0,0,cv._dpr,0,0);
  ctx.clearRect(0,0,cv._W,cv._H);
  drawDesign(ctx, S.edit, cv._W, cv._H);
}

/* ---------- ナビゲーション ---------- */
var NAV = {};
function nav(backLabel, nextLabel, onNext, enabled, onBack){
  NAV = { onNext:onNext, onBack:onBack };

  if(backLabel) h += '<button class="btn ghost back" id="nb">'+esc(backLabel)+'</button>';
  h += '<button class="btn" id="nn" '+(enabled?"":"disabled")+'>'+esc(nextLabel)+'</button>';

function navUpdate(){

/* ---------- 送信 ---------- */
function makeNo(){
  var d = new Date();
  var p = function(n){ return (n<10?"0":"")+n; };
  return "CF" + String(d.getFullYear()).slice(2) + p(d.getMonth()+1) + p(d.getDate())
       + "-" + Math.floor(1000 + Math.random()*9000);
}
function composeToDataURL(d){
  var m = findModel(d.deviceTag);
  var H = MAX_LONG, W = Math.round(H * m.ratio);
  var c = document.createElement("canvas"); c.width = W; c.height = H;
  var ctx = c.getContext("2d");
  ctx.fillStyle = "#FFFDF8"; ctx.fillRect(0,0,W,H);
  drawDesign(ctx, d, W, H);
  return c.toDataURL("image/jpeg", 0.92);
}
function upload(dataUrl, name){
  var fd = new FormData();
  fd.append("image", dataUrl.split(",")[1]);
  fd.append("name", name);
  return fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, { method:"POST", body:fd })
    .then(function(r){ if(!r.ok) throw new Error("http-"+r.status); return r.json(); })
    .then(function(j){ if(!j || !j.success) throw new Error("api-fail"); return j.data.url; });
}
function submit(){
  if(S.sending) return;
  S.sending = true; S.error = ""; render();
  var no = makeNo(); S.orderNo = no;
  var links = [], failed = false;
  var seq = Promise.resolve();
  S.designs.forEach(function(d, i){
    seq = seq.then(function(){
      return upload(composeToDataURL(d), no+"-d"+(i+1)+"-image")
        .then(function(u){ links.push("デザイン"+(i+1)+" 仕上がり："+u); })
        .then(function(){ return d.origSrc ? upload(d.origSrc, no+"-d"+(i+1)+"-orig")
              .then(function(u2){ links.push("デザイン"+(i+1)+" 元写真："+u2); }) : null; })
        .catch(function(){ failed = true; });
    });
  });
  seq.then(function(){
    var lines = [];
    lines.push("【LOCO-P クラファン返礼 入稿】");
    lines.push("受付番号：" + no);
    lines.push("■支援者名：" + S.backer.name);
    lines.push("■ご支援メール：" + S.backer.email);
    lines.push("■リターン：" + S.reward.label);
    lines.push("■ケース本体：" + S.cases.map(function(c){ var m=findModel(c.tag); return (m?m.name:"?")+"（"+c.tag+"）× "+c.qty+"コ"; }).join(" ／ "));
    lines.push("■シート合計：" + totalSheets() + "枚（デザイン" + S.designs.length + "種類）");
    S.designs.forEach(function(d, i){
      var m = findModel(d.deviceTag);
      lines.push("　・デザイン"+(i+1)+"： "+(m?m.name:"?")+"（"+d.deviceTag+"）／"+d.qty+"枚／背景色 "+bgName(d.bg)+"（"+d.bg+"）");
    });
    lines.push("■お届け先：" + S.ship.name + "／〒" + S.ship.zip + "／" + S.ship.addr);
    lines.push("■ご連絡先：" + S.ship.method + "／" + S.ship.contact);
    lines.push("■ご要望：" + (S.ship.notes || "なし"));
    lines.push("（" + SHOP_NAME + "）");
    lines.push("");
    if(failed || !links.length){
      lines.push("※ 画像の自動送信に失敗しました。お客さまに画像を再送いただくか、直接お問い合わせください。");
    } else {
      lines.push("―――― 画像リンク（タップで開けます） ――――");
      links.forEach(function(l){ lines.push(l); });
    }
    return fetch("https://api.web3forms.com/submit", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ access_key: W3F_KEY, subject:"LOCO-P クラファン返礼 入稿 " + no,
                             from_name:"LOCO-P リターン入稿フォーム", message: lines.join("\n") })
    });
  }).then(function(r){
    if(!r || !r.ok) throw new Error("send");
    S.sending = false; S.sent = true; render();
  }).catch(function(){
    S.sending = false;
    S.error = "送信に失敗しました。通信環境をご確認のうえ、もう一度お試しください。繰り返す場合は mihara@kihoukai.or.jp までご連絡ください。";
    render();
  });
}

render();
</script>
</body>
</html>
